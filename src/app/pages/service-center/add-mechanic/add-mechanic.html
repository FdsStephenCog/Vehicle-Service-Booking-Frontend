<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h3>Add Mechanic</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-group mb-3">
              <label for="mechanicName" class="form-label">Mechanic Name</label>
              <input type="text" id="mechanicName" formControlName="mechanicName" class="form-control"
                placeholder="Enter mechanic name" />
              <div *ngIf="form.get('mechanicName')?.invalid && form.get('mechanicName')?.touched"
                class="text-danger mt-1">
                Mechanic name is required.
              </div>
            </div>

            <div class="form-group mb-3">
              <label for="expertise" class="form-label">Expertise</label>
              <input type="text" id="expertise" formControlName="expertise" class="form-control"
                placeholder="Enter expertise (e.g., Engine Repair)" />
              <div *ngIf="form.get('expertise')?.invalid && form.get('expertise')?.touched" class="text-danger mt-1">
                Expertise is required.
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-success" [disabled]="form.invalid">Add Mechanic</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
